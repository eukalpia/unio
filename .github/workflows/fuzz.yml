name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Go module
        id: detect
        run: if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        if: steps.detect.outputs.go == 'true'
        env:
          # Short smoke runs on pull requests, long runs nightly.
          FUZZTIME: ${{ github.event_name == 'pull_request' && '15s' || inputs.fuzztime || '3m' }}
        run: |
          set -uo pipefail
          status=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" "$pkg"; then
                echo "::error::$pkg $target found a failing input"
                status=1
              fi
              echo "::endgroup::"
            done
          done
          exit $status
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
