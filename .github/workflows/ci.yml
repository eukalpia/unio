name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Go module
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Build and test
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  lint:
    name: Lint and security
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Tools are built with the project toolchain so they can read its
      # export data; `go run pkg@latest` may pick an incompatible build.
      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Released gosec binaries can lag behind the Go toolchain; when they
      # cannot read the toolchain's export data they type-check nothing and
      # still exit 0. Build it with a current golang.org/x/tools instead.
      - name: Build gosec
        env:
          # v2.29.0, pinned by commit so a moved tag cannot change the tool.
          GOSEC_COMMIT: deb54465fea23d19a77f037e11e6589021f8501d
          XTOOLS_VERSION: v0.52.0
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          git -C "$src" init --quiet
          git -C "$src" fetch --quiet --depth 1 https://github.com/securego/gosec "$GOSEC_COMMIT"
          git -C "$src" checkout --quiet FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$GOSEC_COMMIT"
          cd "$src"
          go get "golang.org/x/tools@$XTOOLS_VERSION"
          go mod tidy
          go build -o "$(go env GOPATH)/bin/gosec" ./cmd/gosec
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
      - name: gosec
        run: |
          set -uo pipefail
          # No -quiet: it suppresses the report file when nothing is found.
          gosec -exclude-generated -fmt=json -out=gosec.json ./... > /dev/null || true
          test -s gosec.json || { echo "::error::gosec produced no report"; exit 1; }
          type_errors=$(jq '(.["Golang errors"] // {}) | length' gosec.json)
          issues=$(jq '(.Issues // []) | length' gosec.json)
          files=$(jq '.Stats.files' gosec.json)
          echo "gosec scanned $files files: $issues issues, $type_errors packages with type errors"
          if [ "$type_errors" != "0" ]; then
            jq -r '.["Golang errors"] | to_entries[] | "\(.key): \(.value[0].error)"' gosec.json
            echo "::error::gosec could not type-check the module; its results would be incomplete"
            exit 1
          fi
          if [ "$issues" != "0" ]; then
            jq -r '.Issues[] | "::error file=\(.file),line=\(.line)::\(.rule_id) \(.details)"' gosec.json
            exit 1
          fi
