name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Licenses compatible with distributing Apache-2.0 binaries.
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unlicense, 0BSD, CC0-1.0
          # The Go project's golang.org/x modules are BSD-3-Clause with the Go
          # patent grant (PATENTS), which the license detector reports as an
          # unknown reference. They are allowed by name, not by loosening the
          # license list.
          allow-dependencies-licenses: >-
            pkg:golang/golang.org/x/arch,
            pkg:golang/golang.org/x/crypto,
            pkg:golang/golang.org/x/exp,
            pkg:golang/golang.org/x/mod,
            pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/sys,
            pkg:golang/golang.org/x/telemetry,
            pkg:golang/golang.org/x/term,
            pkg:golang/golang.org/x/text,
            pkg:golang/golang.org/x/time,
            pkg:golang/golang.org/x/tools
          comment-summary-in-pr: on-failure
