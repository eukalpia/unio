version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/eukalpia/unio/internal/pb
plugins:
  - local: protoc-gen-go
    out: internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-vtproto
    out: internal/pb
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+equal+clone+pool
