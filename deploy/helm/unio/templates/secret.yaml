{{- if not .Values.auth.existingSecret }}
{{- $name := include "unio.credentialsSecret" . }}
{{- /* lookup returns the live Secret on upgrade, so its values are kept. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if and $existing (hasKey $existing "data") }}
{{- $old = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "unio.labels" . | nindent 4 }}
  annotations:
    # Keep the credentials when the release is uninstalled. The cluster secret
    # identifies the cluster on its drives and protects the stored user secret
    # keys, so losing it leaves the existing drives unusable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  cluster-secret: {{ include "unio.credentialValue" (dict "old" $old "key" "cluster-secret" "length" 64) }}
  root-user: {{ include "unio.credentialValue" (dict "old" $old "key" "root-user" "length" 20) }}
  root-password: {{ include "unio.credentialValue" (dict "old" $old "key" "root-password" "length" 48) }}
  {{- if .Values.metrics.token.enabled }}
  metrics-token: {{ include "unio.credentialValue" (dict "old" $old "key" "metrics-token" "length" 48) }}
  {{- end }}
{{- end }}
