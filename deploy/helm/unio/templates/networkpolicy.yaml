{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "unio.fullname" . }}
  labels:
    {{- include "unio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "unio.selectorLabels" . | nindent 6 }}
  # Only ingress is restricted. Egress stays open, so that DNS and the API
  # server remain reachable.
  policyTypes:
    - Ingress
  ingress:
    # Internode traffic (port 9100): only pods of this release.
    - from:
        - podSelector:
            matchLabels:
              {{- include "unio.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9100
    # S3 traffic (port 9000): the configured peers, or any source when none are
    # set. Kubelet probes come from the node address. Some CNIs block them under
    # policies, so add the node range to networkPolicy.s3From in that case.
    - ports:
        - protocol: TCP
          port: 9000
      {{- with .Values.networkPolicy.s3From }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
