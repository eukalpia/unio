# Comparison cluster: MinIO distributed mode, 4 nodes x 4 drives, same topology
# and host ports as cluster-4x4.yml.
#
# Usage, from the repository root:
#   docker compose -f deploy/compose/minio-4x4.yml up -d
#
# Do not run this together with cluster-4x4.yml: both publish host ports
# 9001 to 9004 on 127.0.0.1. Stop one stack before starting the other.
#
# The MinIO console is not published.

name: minio-4x4

x-minio-node: &minio-node
  # Pinned release. Confirm the tag before use; see deploy/compose/.env.example.
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  command: ["server", "http://minio{1...4}:9000/data{1...4}"]
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &minio-env
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/compose/.env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/compose/.env}
  networks: &minio-networks
    - internal
    - public

services:
  minio1:
    <<: *minio-node
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - minio1-data1:/data1
      - minio1-data2:/data2
      - minio1-data3:/data3
      - minio1-data4:/data4

  minio2:
    <<: *minio-node
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - minio2-data1:/data1
      - minio2-data2:/data2
      - minio2-data3:/data3
      - minio2-data4:/data4

  minio3:
    <<: *minio-node
    ports:
      - "127.0.0.1:9003:9000"
    volumes:
      - minio3-data1:/data1
      - minio3-data2:/data2
      - minio3-data3:/data3
      - minio3-data4:/data4

  minio4:
    <<: *minio-node
    ports:
      - "127.0.0.1:9004:9000"
    volumes:
      - minio4-data1:/data1
      - minio4-data2:/data2
      - minio4-data3:/data3
      - minio4-data4:/data4

networks:
  internal:
    internal: true
  public:
    driver: bridge

volumes:
  minio1-data1:
  minio1-data2:
  minio1-data3:
  minio1-data4:
  minio2-data1:
  minio2-data2:
  minio2-data3:
  minio2-data4:
  minio3-data1:
  minio3-data2:
  minio3-data3:
  minio3-data4:
  minio4-data1:
  minio4-data2:
  minio4-data3:
  minio4-data4:
