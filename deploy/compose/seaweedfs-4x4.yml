# Comparison cluster: SeaweedFS with 4 volume servers x 4 drives, one master
# and one filer serving the S3 API. Used by bench/compare.md.
#
# SeaweedFS has a different architecture from Unio and MinIO: objects go
# through a filer to volume servers, and erasure coding is an offline step for
# sealed volumes. To give the data the same kind of protection against a node
# failure, volumes are replicated to a second volume server (replication
# "001"). That stores every byte twice, where the erasure-coded clusters store
# 1.33 times; record this next to any result.
#
# The S3 endpoint is the filer, published on host port 9001 like the first
# node of the other clusters.
#
# Usage, from the repository root:
#   docker compose -f deploy/compose/seaweedfs-4x4.yml up -d

name: seaweedfs-4x4

x-weed: &weed
  image: chrislusf/seaweedfs:4.48
  stop_grace_period: 30s
  networks:
    - internal

# Docker creates named volumes owned by root, and the image's entrypoint hands
# only /data itself to the unprivileged seaweed user (uid 1000), so the
# volume servers could not write to their drives. The drives service gives
# every drive to that user before any volume server starts.
x-volume: &volume
  <<: *weed
  depends_on:
    master:
      condition: service_started
    drives:
      condition: service_completed_successfully

services:
  drives:
    image: chrislusf/seaweedfs:4.48
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /v"]
    volumes:
      - v1-d1:/v/1/1
      - v1-d2:/v/1/2
      - v1-d3:/v/1/3
      - v1-d4:/v/1/4
      - v2-d1:/v/2/1
      - v2-d2:/v/2/2
      - v2-d3:/v/2/3
      - v2-d4:/v/2/4
      - v3-d1:/v/3/1
      - v3-d2:/v/3/2
      - v3-d3:/v/3/3
      - v3-d4:/v/3/4
      - v4-d1:/v/4/1
      - v4-d2:/v/4/2
      - v4-d3:/v/4/3
      - v4-d4:/v/4/4
    network_mode: none
  master:
    <<: *weed
    command: ["master", "-ip=master", "-port=9333", "-defaultReplication=001", "-volumeSizeLimitMB=1024"]
  volume1:
    <<: *volume
    command: ["volume", "-ip=volume1", "-port=8080", "-master=master:9333", "-dir=/data/d1,/data/d2,/data/d3,/data/d4", "-max=0", "-rack=rack1"]
    volumes: [v1-d1:/data/d1, v1-d2:/data/d2, v1-d3:/data/d3, v1-d4:/data/d4]
  volume2:
    <<: *volume
    command: ["volume", "-ip=volume2", "-port=8080", "-master=master:9333", "-dir=/data/d1,/data/d2,/data/d3,/data/d4", "-max=0", "-rack=rack1"]
    volumes: [v2-d1:/data/d1, v2-d2:/data/d2, v2-d3:/data/d3, v2-d4:/data/d4]
  volume3:
    <<: *volume
    command: ["volume", "-ip=volume3", "-port=8080", "-master=master:9333", "-dir=/data/d1,/data/d2,/data/d3,/data/d4", "-max=0", "-rack=rack1"]
    volumes: [v3-d1:/data/d1, v3-d2:/data/d2, v3-d3:/data/d3, v3-d4:/data/d4]
  volume4:
    <<: *volume
    command: ["volume", "-ip=volume4", "-port=8080", "-master=master:9333", "-dir=/data/d1,/data/d2,/data/d3,/data/d4", "-max=0", "-rack=rack1"]
    volumes: [v4-d1:/data/d1, v4-d2:/data/d2, v4-d3:/data/d3, v4-d4:/data/d4]
  filer:
    <<: *weed
    depends_on: [volume1, volume2, volume3, volume4]
    environment:
      S3_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:?set SEAWEED_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEED_SECRET_KEY:?set SEAWEED_SECRET_KEY}
    # The S3 identity is written from the environment at start, so no key is
    # stored in this file.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"bench","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed filer -ip=filer -master=master:9333 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:9001:8333"
    networks:
      - internal
      - public

networks:
  internal:
    internal: true
  public:
    driver: bridge

volumes:
  v1-d1:
  v1-d2:
  v1-d3:
  v1-d4:
  v2-d1:
  v2-d2:
  v2-d3:
  v2-d4:
  v3-d1:
  v3-d2:
  v3-d3:
  v3-d4:
  v4-d1:
  v4-d2:
  v4-d3:
  v4-d4:
